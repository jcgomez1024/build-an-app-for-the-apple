<!doctype html><html><head><meta charset="utf-8"><title>Elvi ticket preview v5</title><style>
  :root { --red:#c8102e; --green:#178a3e; --amber:#e8a317; --ink:#1d1d1f; --muted:#6b6b70; --bg:#f5f2ec; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:#fff; border-bottom:1px solid #e6e1d8; position:sticky; top:0; z-index:2; }
  header img { height:40px; }
  header h1 { font-size:20px; margin:0; flex:1; }
  .pill { padding:6px 12px; border-radius:999px; font-weight:700; font-size:14px; background:#eee; color:var(--muted); }
  .pill.on { background:#dff3e6; color:var(--green); } .pill.off { background:#fde3e6; color:var(--red); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
  .card { background:var(--card); border-radius:18px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin:0 0 10px; font-size:17px; display:flex; justify-content:space-between; align-items:center; }
  .count { background:var(--red); color:#fff; border-radius:999px; padding:2px 10px; font-size:14px; }
  .count.zero { background:#ddd; color:#555; }
  .caller { display:flex; align-items:center; gap:12px; padding:10px; border-radius:12px; background:#faf8f4; margin-top:8px; }
  .caller .who { flex:1; min-width:0; }
  .caller b { font-size:18px; display:block; }
  .caller small { color:var(--muted); font-size:14px; }
  .badge { font-size:12px; font-weight:700; padding:2px 8px; border-radius:6px; background:#efe7ff; color:#5b2bbf; margin-left:6px; vertical-align:middle; }
  .badge.lang { background:#e7f0ff; color:#1f4fbf; }
  button { font:inherit; font-weight:700; border:0; border-radius:14px; padding:14px 18px; cursor:pointer; font-size:17px; }
  button:disabled { opacity:.45; cursor:default; }
  .answer { background:var(--green); color:#fff; min-width:130px; }
  .hold { background:var(--amber); color:#222; } .hang { background:var(--red); color:#fff; } .mute { background:#e9e9ee; color:#222; }
  .mute.on { background:#222; color:#fff; }
  .ringing .answer { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); box-shadow:0 0 0 8px rgba(23,138,62,.18); } }
  #activeCard { border:3px solid var(--green); display:none; }
  #activeCard .big { font-size:28px; font-weight:800; }
  #activeCard .num { font-size:20px; color:var(--muted); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .actions button { flex:1; min-width:120px; }
  .empty { color:var(--muted); padding:8px 2px; }
  .vm { border-top:1px solid #eee; padding:10px 0; }
  .vm p { margin:6px 0; }
  .vm .order { font-size:14px; background:#f3fbf5; border-radius:8px; padding:6px 8px; }
  #login { max-width:380px; margin:60px auto; text-align:center; }
  #login input { font-size:28px; letter-spacing:8px; text-align:center; width:100%; padding:12px; border-radius:12px; border:1px solid #ccc; margin:12px 0; }
  #login button { width:100%; background:var(--red); color:#fff; }
  .err { color:var(--red); min-height:22px; }
  #app { display:none; }

  /* Elvi kitchen ticket (Square thermal style) */
  .ticket-wrap { display:grid; grid-template-columns: 1fr minmax(260px, 300px); gap:16px; align-items:start; }
  @media (max-width:820px) { .ticket-wrap { grid-template-columns: 1fr; } }
  .ticket-panel { background:#2a2a2e; border-radius:18px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .ticket-panel h2 { color:#f5f2ec; margin:0 0 10px; font-size:17px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ticket-panel .hint { color:#a8a8ae; font-size:12px; font-weight:500; margin:0 0 10px; }
  .ticket-paper {
    background:#fff; color:#111; width:100%; max-width:280px; margin:0 auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size:12px; line-height:1.35; padding:14px 12px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.35); border-radius:2px;
  }
  .ticket-paper .top-name { font-size:22px; font-weight:800; text-align:left; margin:0; letter-spacing:-0.02em; }
  .ticket-paper .source { font-size:12px; font-weight:500; margin:2px 0 6px; color:#222; }
  .ticket-paper .phone { font-size:12px; margin:4px 0 0; color:#222; }
  .ticket-paper .rule { border:0; border-top:1px solid #111; margin:6px 0; }
  .ticket-paper .dt { display:flex; justify-content:space-between; gap:8px; font-size:11px; }
  .ticket-paper .fulfill { text-align:center; font-weight:700; letter-spacing:0.02em; margin:4px 0; font-size:12px; text-transform:none; }
  .ticket-paper .ready { text-align:center; font-size:11px; margin:2px 0 4px; }
  .ticket-paper .deliver { font-size:11px; margin:6px 0; }
  .ticket-paper .deliver b { display:block; margin-bottom:2px; }
  .ticket-paper .item { margin:10px 0 4px; }
  .ticket-paper .item-head { font-size:14px; font-weight:800; }
  .ticket-paper .mod { padding-left:14px; font-size:11px; color:#222; font-weight:400; }
  .ticket-paper .note { padding-left:14px; font-size:11px; font-style:italic; color:#222; }
  .ticket-paper .flag { margin-top:4px; padding:3px 6px; background:#fff3cd; border:1px solid #e8a317; border-radius:4px; font-size:10px; font-weight:700; color:#6a4a00; }
  .ticket-paper .foot { font-size:11px; margin-top:4px; }
  .ticket-paper .phase { font-size:10px; color:#666; margin-top:4px; }
  .ticket-paper .listening { color:#178a3e; font-weight:700; }
  .ticket-empty { color:#a8a8ae; text-align:center; padding:24px 8px; font-size:13px; }
  .last-tickets { margin-top:12px; }
  .last-tickets button {
    display:block; width:100%; text-align:left; background:#3a3a40; color:#f5f2ec;
    border:0; border-radius:10px; padding:8px 10px; margin-top:6px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .last-tickets button:hover, .last-tickets button.on { background:#c8102e; color:#fff; }
  .last-tickets button small { display:block; font-weight:500; opacity:.85; font-size:11px; margin-top:2px; }
  #activeCard .ticket-inline { margin-top:14px; }


body{background:#1a1a1e;padding:20px;margin:0;font-family:-apple-system,sans-serif}
h1{color:#f5f2ec;font-size:18px;margin:0 0 6px}.top{color:#aaa;font-size:13px;margin:0 0 16px}
.row{display:flex;gap:18px;align-items:flex-start}.col{background:#2a2a2e;padding:12px;border-radius:14px;width:300px}
.col h2{color:#ccc;font-size:12px;font-weight:600;margin:0 0 10px}</style></head><body>
<h1>Elvi kitchen ticket preview v5</h1><p class="top">NO BEBIDA / NO DRINK = container divider (never merged across) · Deluxe label = Lechuga, Pico, Crema, Queso Fresco until Square is renamed</p>
<div class="row" id="row"></div>
<script>const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function ticketDateParts(iso) {
  try {
    const d = new Date(iso);
    const date = d.toLocaleDateString("en-US", { timeZone: "America/New_York", month: "long", day: "numeric", year: "numeric" });
    const time = d.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", second: "2-digit" });
    return { date, time };
  } catch { return { date: "—", time: "" }; }
}
function renderTicketPaper(t) {
  if (!t) return '<div class="ticket-empty">Sin ticket todavía.</div>';
  const title = t.name ? esc(t.name) : ("Receipt #" + esc(t.receiptCode || "XXXX"));
  const { date, time } = ticketDateParts(t.at);
  const source = t.source || "Elvi Phone";
  const phone = t.phoneDisplay || "";
  const items = (t.lines || []).map((l) => {
    const mods = (l.choices || []).map((c) => `<div class="mod">${esc(c)}</div>`).join("");
    const notes = (l.notes || []).map((n) => `<div class="note">${esc(n)}</div>`).join("");
    const flag = l.flag ? `<div class="flag">${esc(l.flag)}</div>` : "";
    return `<div class="item"><div class="item-head">${esc(l.quantity)} × ${esc(l.name)}</div>${mods}${notes}${flag}</div>`;
  }).join("") || (t.phase === "listening"
    ? '<div class="ticket-empty" style="padding:12px 0">Elvi escuchará al colgar…</div>'
    : '<div class="ticket-empty" style="padding:12px 0">Sin artículos.</div>');
  const fulfill = esc(t.fulfillment || "TO GO / LLEVAR");
  const ready = t.readyTime ? `<div class="ready">${esc(t.readyTime)}</div>` : "";
  let deliver = "";
  if (t.deliverTo && (t.deliverTo.address || t.deliverTo.phone)) {
    deliver = `<div class="deliver"><b>Deliver to:</b>${esc(t.deliverTo.name || t.name || "")}<br>${esc(t.deliverTo.address || "")}<br>${esc(t.deliverTo.phone || phone)}${t.deliverTo.notes ? `<div class="note">${esc(t.deliverTo.notes)}</div>` : ""}</div>`;
  } else if (phone) {
    deliver = `<div class="phone">${esc(phone)}</div>`;
  }
  const foot = `<hr class="rule"><div class="foot">Receipt: #${esc(t.receiptCode || "XXXX")}</div>`;
  const phase = t.phase === "listening"
    ? '<div class="phase listening">Elvi escuchando… (live aún no activo)</div>'
    : '<div class="phase">Final · desde grabación</div>';
  return `<div class="ticket-paper"><div class="top-name">${title}</div><div class="source">${esc(source)}</div><hr class="rule"><div class="dt"><span>${esc(date)}</span><span>${esc(time)}</span></div><hr class="rule"><div class="fulfill">${fulfill}</div>${ready}<hr class="rule">${deliver}${items}${foot}${phase}</div>`;
}

const T = [{"h":"Split: \"seis quesadillas de comal de bistec en diferentes recipientes\" → 3 + NO BEBIDA + 3","t":{"language":"es","phase":"final","fulfillment":"TO GO / LLEVAR","training":false,"callSid":"CApreview5a","at":"2026-10-17T17:40:12Z","name":"Maria","receiptCode":"7Q2K","source":"Elvi Phone · 551","phoneDisplay":"+1 440-555-0142","lines":[{"name":"Quesadilla","quantity":3,"choices":["(QCO) Quesadilla de Comal / Homemade","Bistec / Steak"],"notes":[],"totalCents":1350,"flag":null,"kind":"food"},{"name":"NO BEBIDA / NO DRINK","quantity":1,"choices":[],"notes":[],"kind":"divider","flag":null},{"name":"Quesadilla","quantity":3,"choices":["(QCO) Quesadilla de Comal / Homemade","Bistec / Steak"],"notes":[],"totalCents":1350,"flag":null,"kind":"food"}]}},{"h":"Same 6 quesadillas, no split asked → merged 6 ×","t":{"language":"es","phase":"final","fulfillment":"TO GO / LLEVAR","training":false,"callSid":"CApreview5b","at":"2026-10-17T17:44:03Z","name":null,"receiptCode":"3MXA","source":"Elvi Phone · 289","phoneDisplay":"+1 440-555-0188","lines":[{"name":"Quesadilla","quantity":6,"choices":["(QCO) Quesadilla de Comal / Homemade","Bistec / Steak"],"notes":[],"totalCents":2700,"flag":null,"kind":"food"}]}},{"h":"Deluxe now includes Queso Fresco · note mode (italic no crema)","t":{"language":"es","phase":"final","fulfillment":"TO GO / LLEVAR","training":false,"callSid":"CApreview5c","at":"2026-10-17T17:51:40Z","name":"Tony","receiptCode":"9DLX","source":"Elvi Phone · 289","phoneDisplay":"+1 440-555-0107","lines":[{"name":"Sopesaso Elvis","quantity":1,"choices":["Bistec / Steak","Chorizo","DELUXE (Lechuga/Lettuce, Pico, Crema/Sour Cream, Queso Fresco)"],"notes":["no crema"],"totalCents":1350,"flag":null,"kind":"food"},{"name":"Taco","quantity":2,"choices":["(TCO) Taco de Comal / Homemade","Pastor / Marinated Pork"],"notes":[],"totalCents":700,"flag":null,"kind":"food"}]}}];
document.getElementById("row").innerHTML = T.map((x) => '<div class="col"><h2>' + esc(x.h) + '</h2>' + renderTicketPaper(x.t) + '</div>').join("");
</script></body></html>
