<!doctype html><html><head><meta charset="utf-8"><style>
  :root { --red:#c8102e; --green:#178a3e; --amber:#e8a317; --ink:#1d1d1f; --muted:#6b6b70; --bg:#f5f2ec; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:#fff; border-bottom:1px solid #e6e1d8; position:sticky; top:0; z-index:2; }
  header img { height:40px; }
  header h1 { font-size:20px; margin:0; flex:1; }
  .pill { padding:6px 12px; border-radius:999px; font-weight:700; font-size:14px; background:#eee; color:var(--muted); }
  .pill.on { background:#dff3e6; color:var(--green); } .pill.off { background:#fde3e6; color:var(--red); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
  .card { background:var(--card); border-radius:18px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin:0 0 10px; font-size:17px; display:flex; justify-content:space-between; align-items:center; }
  .count { background:var(--red); color:#fff; border-radius:999px; padding:2px 10px; font-size:14px; }
  .count.zero { background:#ddd; color:#555; }
  .caller { display:flex; align-items:center; gap:12px; padding:10px; border-radius:12px; background:#faf8f4; margin-top:8px; }
  .caller .who { flex:1; min-width:0; }
  .caller b { font-size:18px; display:block; }
  .caller small { color:var(--muted); font-size:14px; }
  .badge { font-size:12px; font-weight:700; padding:2px 8px; border-radius:6px; background:#efe7ff; color:#5b2bbf; margin-left:6px; vertical-align:middle; }
  .badge.lang { background:#e7f0ff; color:#1f4fbf; }
  button { font:inherit; font-weight:700; border:0; border-radius:14px; padding:14px 18px; cursor:pointer; font-size:17px; }
  button:disabled { opacity:.45; cursor:default; }
  .answer { background:var(--green); color:#fff; min-width:130px; }
  .hold { background:var(--amber); color:#222; } .hang { background:var(--red); color:#fff; } .mute { background:#e9e9ee; color:#222; }
  .mute.on { background:#222; color:#fff; }
  .ringing .answer { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); box-shadow:0 0 0 8px rgba(23,138,62,.18); } }
  #activeCard { border:3px solid var(--green); display:none; }
  #activeCard .big { font-size:28px; font-weight:800; }
  #activeCard .num { font-size:20px; color:var(--muted); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .actions button { flex:1; min-width:120px; }
  .empty { color:var(--muted); padding:8px 2px; }
  .vm { border-top:1px solid #eee; padding:10px 0; }
  .vm p { margin:6px 0; }
  .vm .order { font-size:14px; background:#f3fbf5; border-radius:8px; padding:6px 8px; }
  #login { max-width:380px; margin:60px auto; text-align:center; }
  #login input { font-size:28px; letter-spacing:8px; text-align:center; width:100%; padding:12px; border-radius:12px; border:1px solid #ccc; margin:12px 0; }
  #login button { width:100%; background:var(--red); color:#fff; }
  .err { color:var(--red); min-height:22px; }
  #app { display:none; }

  /* calllog1: call log (every incoming call) */
  .left-col { display:grid; gap:16px; align-content:start; min-width:0; }
  .cl-head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  .cl-filters { display:flex; gap:6px; }
  .cl-filters button { padding:6px 12px; font-size:14px; border-radius:999px; background:#efece6; color:#333; }
  .cl-filters button.on { background:var(--red); color:#fff; }
  .cl-sum { color:var(--muted); font-size:14px; margin:6px 0 4px; font-weight:600; }
  .cl-day { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 4px; }
  .cl-row { display:grid; grid-template-columns:78px 1fr auto; gap:4px 10px; align-items:center; padding:9px 10px; border-radius:12px; background:#faf8f4; margin-top:6px; border-left:4px solid transparent; }
  .cl-row.missed { background:#fff3f4; border-left-color:var(--red); }
  .cl-row.rejected { opacity:.6; }
  .cl-time { font-weight:800; font-size:15px; white-space:nowrap; }
  .cl-who b { font-size:16px; }
  .cl-who small, .cl-meta { color:var(--muted); font-size:13px; }
  .cl-line { font-size:11px; font-weight:800; padding:1px 7px; border-radius:6px; background:#e7f0ff; color:#1f4fbf; margin-left:6px; vertical-align:middle; }
  .cl-out { font-size:14px; font-weight:700; }
  .cl-out.ok { color:var(--green); } .cl-out.bad { color:var(--red); } .cl-out.vm { color:#9a5b00; } .cl-out.na { color:var(--muted); }
  .cl-acts { display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  .cl-acts button, .cl-acts a { padding:6px 10px; font-size:13px; border-radius:10px; background:#e9e9ee; color:#222; text-decoration:none; font-weight:700; }
  .cl-acts a.call { background:var(--green); color:#fff; }
  .tag-test { font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; background:#efe7ff; color:#5b2bbf; margin-left:6px; vertical-align:middle; }

  /* Elvi kitchen ticket (Square thermal style) */
  .ticket-wrap { display:grid; grid-template-columns: 1fr minmax(260px, 300px); gap:16px; align-items:start; }
  @media (max-width:820px) { .ticket-wrap { grid-template-columns: 1fr; } }
  .ticket-panel { background:#2a2a2e; border-radius:18px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .ticket-panel h2 { color:#f5f2ec; margin:0 0 10px; font-size:17px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ticket-panel .hint { color:#a8a8ae; font-size:12px; font-weight:500; margin:0 0 10px; }
  .ticket-paper {
    background:#fff; color:#111; width:100%; max-width:280px; margin:0 auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size:12px; line-height:1.35; padding:14px 12px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.35); border-radius:2px;
  }
  .ticket-paper .top-name { font-size:22px; font-weight:800; text-align:left; margin:0; letter-spacing:-0.02em; }
  .ticket-paper .source { font-size:12px; font-weight:500; margin:2px 0 6px; color:#222; }
  .ticket-paper .phone { font-size:12px; margin:4px 0 0; color:#222; }
  .ticket-paper .rule { border:0; border-top:1px solid #111; margin:6px 0; }
  .ticket-paper .dt { display:flex; justify-content:space-between; gap:8px; font-size:11px; }
  .ticket-paper .fulfill { text-align:center; font-weight:700; letter-spacing:0.02em; margin:4px 0; font-size:12px; text-transform:none; }
  .ticket-paper .ready { text-align:center; font-size:11px; margin:2px 0 4px; }
  .ticket-paper .deliver { font-size:11px; margin:6px 0; }
  .ticket-paper .deliver b { display:block; margin-bottom:2px; }
  .ticket-paper .item { margin:10px 0 4px; }
  .ticket-paper .item-head { font-size:14px; font-weight:800; }
  .ticket-paper .mod { padding-left:14px; font-size:11px; color:#222; font-weight:400; }
  .ticket-paper .note { padding-left:14px; font-size:11px; font-style:italic; color:#222; }
  .ticket-paper .flag { margin-top:4px; padding:3px 6px; background:#fff3cd; border:1px solid #e8a317; border-radius:4px; font-size:10px; font-weight:700; color:#6a4a00; }
  .ticket-paper .foot { font-size:11px; margin-top:4px; }
  .ticket-paper .phase { font-size:10px; color:#666; margin-top:4px; }
  .ticket-paper .listening { color:#178a3e; font-weight:700; }
  .ticket-empty { color:#a8a8ae; text-align:center; padding:24px 8px; font-size:13px; }
  .last-tickets { margin-top:12px; }
  .last-tickets button {
    display:block; width:100%; text-align:left; background:#3a3a40; color:#f5f2ec;
    border:0; border-radius:10px; padding:8px 10px; margin-top:6px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .last-tickets button:hover, .last-tickets button.on { background:#c8102e; color:#fff; }
  .last-tickets button small { display:block; font-weight:500; opacity:.85; font-size:11px; margin-top:2px; }
  #activeCard .ticket-inline { margin-top:14px; }

  <div class="cl-head"><h2 style="margin:0">Llamadas</h2>
    <div class="cl-filters"><button>Hoy</button><button>Ayer</button><button class="on">7 días</button></div></div>
  <div class="cl-sum" id="clSum">—</div><div id="clRows"></div></section>
<script>const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const $ = (id) => document.getElementById(id);
const setHtml = (id, html) => { $(id).innerHTML = html; };
// calllog1: every incoming call, grouped by day (today first).
let callRange = "today", lastCallsJson = "";
const RANGE_LABEL = { today: "Hoy", yesterday: "Ayer", "7d": "7 días" };
function dayLabel(day) {
  const fmtDay = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const today = fmtDay(new Date()), yest = fmtDay(new Date(Date.now() - 86400000));
  const pretty = new Date(day + "T12:00:00").toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
  return day === today ? `Hoy · ${pretty}` : day === yest ? `Ayer · ${pretty}` : pretty;
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function callSummary(s) {
  const parts = [plural(s.total, "llamada", "llamadas"), plural(s.answered, "contestada", "contestadas"), `${s.voicemail} buzón`, `${s.hungup} ${s.hungup === 1 ? "colgó" : "colgaron"}`];
  if (s.rejected) parts.push(plural(s.rejected, "rechazada", "rechazadas"));
  if (s.inProgress) parts.push(`${s.inProgress} en curso`);
  return `${RANGE_LABEL[callRange]}: ${parts.join(" · ")}`;
}
function callRow(r) {
  const cls = r.outcome === "counter" || r.outcome === "desk" ? "ok" : r.outcome === "hungup" ? "bad" : r.outcome === "voicemail" ? "vm" : "na";
  const who = r.name ? esc(r.name) : esc(r.numberDisplay);
  const dur = r.durationSec != null && r.durationSec > 0 ? ` · ${mmss(r.durationSec)}` : "";
  const acts = [
    r.recordingSid ? `<button data-vm="${esc(r.recordingSid)}">▶ ${r.recordingKind === "voicemail" ? "Buzón" : "Grabación"}</button>` : "",
    r.hasTicket ? `<button data-ticket="${esc(r.callSid)}">Ticket</button>` : "",
    r.missed && r.number ? `<a class="call" href="tel:${esc(r.number)}">Llamar</a>` : "",
  ].join("");
  return `<div class="cl-row ${r.missed ? "missed" : ""} ${r.outcome === "rejected" ? "rejected" : ""}">
    <div class="cl-time">${esc(r.time)}</div>
    <div class="cl-who"><b>${who}</b>${r.training ? '<span class="tag-test">prueba</span>' : ""}${r.line ? `<span class="cl-line">${esc(r.line)}</span>` : ""}
      <div class="cl-meta">${r.name ? esc(r.numberDisplay) + " · " : ""}<span class="cl-out ${cls}">${esc(r.outcomeLabel)}</span>${dur}</div></div>
    <div class="cl-acts">${acts}</div></div>`;
}
function renderCalls(j) {
  $("clSum").textContent = callSummary(j.summary);
  if (!j.rows.length) { setHtml("clRows", '<div class="empty">Sin llamadas.</div>'); return; }
  const byDay = new Map();
  for (const r of j.rows) { if (!byDay.has(r.day)) byDay.set(r.day, []); byDay.get(r.day).push(r); }
  setHtml("clRows", [...byDay.entries()].sort((a, b) => b[0].localeCompare(a[0])).map(([day, rows]) =>
    `<div class="cl-day">${esc(dayLabel(day))} · ${rows.length}</div>${rows.map(callRow).join("")}`).join(""));
}
async function loadCalls() {
  try {
    const j = await api(`/api/phone/calls?range=${callRange}`);
    const s = JSON.stringify(j);
    if (s !== lastCallsJson) { lastCallsJson = s; renderCalls(j); }
  } catch (e) { setHtml("clRows", `<div class="empty">No se pudo cargar: ${esc(e.message)}</div>`); }
}
