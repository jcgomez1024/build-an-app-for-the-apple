<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call Accuracy · Cocina Elvis</title>
<link rel="icon" type="image/png" href="./img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#1d1d1f;--mut:#6b6b70;--bg:#f6f4ef;--card:#fff;--line:#e6e2d9;--ok:#1a8c3a;--okbg:#e5f6ea;--warn:#b26a00;--warnbg:#fff4dc;--bad:#c62828;--badbg:#fdeaea;--acc:#1471d6}
  *{box-sizing:border-box}body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  header img{width:42px;height:42px}header h1{font-family:Syne,sans-serif;font-size:22px;margin:0}header .sp{flex:1}
  select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  main{max-width:1200px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi b{display:block;font-size:28px;font-family:Syne,sans-serif}.kpi span{color:var(--mut);font-size:13px}
  h2{font-size:16px;margin:0 0 10px}
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;position:relative;border-bottom:1px solid var(--line);padding-top:8px}
  .chart .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);font-size:11px;color:var(--ok)}
  .bar{flex:1;min-width:14px;max-width:46px;border-radius:6px 6px 0 0;background:var(--acc);position:relative}
  .bar small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
  .bar i{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-style:normal}
  .tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--ink);color:#fff}
  .layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
  .list{display:grid;gap:8px;max-height:72vh;overflow:auto}
  .call{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:#fff}
  .call.on{outline:2px solid var(--acc)}.call .t{font-weight:700}.call .m{color:var(--mut);font-size:12px}
  .badge{align-self:center;grid-row:span 2;font-weight:700;border-radius:999px;padding:4px 10px;font-size:13px}
  .b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-na{background:#eee;color:var(--mut)}
  .turns{display:grid;gap:6px;max-height:300px;overflow:auto}
  .turn{padding:6px 10px;border-radius:10px;max-width:85%;font-size:14px}.turn.caller{background:#eef4ff;justify-self:start}.turn.staff{background:#f1efe9;justify-self:end}
  .turn b{font-size:11px;color:var(--mut);display:block}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut)}
  tr.miss td{background:var(--badbg)}tr.partial td{background:var(--warnbg)}.ch{color:var(--mut);font-size:12px}
  .misses{margin:10px 0 0;padding-left:18px;color:var(--bad)}.empty{color:var(--mut);padding:20px;text-align:center}
  .note{font-size:12px;color:var(--mut)}
  .navl{font-size:14px;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  #pinbox{max-width:360px;margin:60px auto;display:grid;gap:10px}#pinbox input{font:inherit;font-size:22px;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:4px}
  @media (max-width:600px){header{flex-wrap:wrap;padding:10px 12px}header h1{font-size:18px}main{padding:10px}.kpi b{font-size:22px}.list{max-height:40vh}.turn{max-width:95%}.player button{flex:1 1 auto}}
  .player{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fbfaf7}
  .player .row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.player button{min-width:44px;min-height:40px}
  .player button.on{background:var(--ink);color:#fff}.player .tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;margin-left:auto}
  .player input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--acc);height:28px}
  .turn{cursor:pointer;transition:background .15s}.turn:hover{filter:brightness(.97)}.turn.elvi{background:#fde8f1;justify-self:end}
  .turn.now{outline:2px solid var(--acc);box-shadow:0 2px 8px #1471d633}
  .turns{max-height:420px}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#efe6ff;color:#5b2bb5;margin-left:6px;vertical-align:middle}
  .filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.filters button.on{background:var(--ink);color:#fff}
  .exp textarea{width:100%;min-height:70px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px}
  .exp .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.exp .ask{color:var(--warn);font-size:13px;margin-top:6px}
  @media (max-width:820px){.layout,.cmp{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><img src="./img/logo-cocina-elvis.png" alt="" /><h1>Llamadas / Calls</h1><a class="navl" href="phone.html">📞 Teléfono</a><span class="sp"></span>
  <select id="days"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option></select>
  <button id="reload">Actualizar</button></header>
<main>
  <section class="kpis">
    <div class="card kpi"><b id="k-avg">–</b><span>Precisión con clientes (meta 95%) · <i id="k-scored">0</i> calificadas</span></div>
    <div class="card kpi"><b id="k-train">–</b><span>Precisión en entrenamiento · <i id="k-tscored">0</i> calificadas</span></div>
    <div class="card kpi"><b id="k-calls">–</b><span>Llamadas grabadas</span></div>
    <div class="card kpi"><b id="k-missed">–</b><span>No contestadas</span></div>
  </section>
  <section class="card"><div class="tabs"><button data-p="daily" class="on">Diario</button><button data-p="weekly">Semanal</button></div>
    <div class="chart" id="chart"></div><div class="note" style="margin-top:22px" id="sqnote"></div></section>
  <section class="layout">
    <div class="card"><h2>Llamadas</h2><div class="filters" id="filters"><button data-f="all" class="on">Todas</button><button data-f="customer">Clientes</button><button data-f="training">Entrenamiento</button></div><div class="list" id="list"></div></div>
    <div class="card" id="detail"><div class="empty">Elige una llamada.</div></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const money = (c) => `$${(Number(c || 0) / 100).toFixed(2)}`;
const fmtTime = (iso) => new Date(iso).toLocaleString("es-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const badge = (s) => s === null ? `<span class="badge b-na">sin ticket</span>` : `<span class="badge ${s >= 95 ? "b-ok" : s >= 80 ? "b-warn" : "b-bad"}">${s}%</span>`;
const lastDigits = (p) => (p ? "•••" + String(p).replace(/\D/g, "").slice(-4) : "");
let data = null, period = "daily", current = null, filter = "all", draft = null;
const tagHtml = (c) => c.source === "training" ? `<span class="tag">Entrenamiento</span>` : "";
const shown = () => data.calls.map((c, i) => ({ c, i })).filter(({ c }) => filter === "all" || (filter === "training" ? c.source === "training" : c.source !== "training"));
const avgOf = (rows) => { const s = rows.filter((c) => c.score !== null); return { n: s.length, avg: s.length ? Math.round(s.reduce((a, c) => a + c.score, 0) / s.length * 10) / 10 : null }; };

function chart() {
  const rows = ((filter === "training" ? data?.trainingTrend : data?.trend)?.[period] || []).slice(-14);
  const el = $("#chart");
  if (!rows.length) { el.innerHTML = `<div class="empty" style="width:100%">Todavía no hay llamadas ${filter === "training" ? "de entrenamiento" : "de clientes"} calificadas.</div>`; return; }
  el.innerHTML = `<div class="goal" style="bottom:${95 * 1.4}px">95%</div>` + rows.map((r) =>
    `<div class="bar" style="height:${Math.max(4, r.avg * 1.4)}px;background:${r.avg >= 95 ? "var(--ok)" : r.avg >= 80 ? "var(--warn)" : "var(--bad)"}"><i>${r.avg}%</i><small>${esc(r.period.replace(/^wk /, "sem "))} (${r.calls})</small></div>`).join("");
}

function list() {
  const calls = shown();
  $("#list").innerHTML = calls.length ? calls.map(({ c, i }) => `
    <div class="call ${current === i ? "on" : ""}" data-i="${i}">
      <div class="t">${fmtTime(c.at)}${tagHtml(c)}</div>${c.answered === false ? `<span class="badge b-bad">no contestada</span>` : c.turns.length ? badge(c.score) : `<span class="badge b-na">${c.error ? "error" : "sin audio"}</span>`}
      <div class="m">${lastDigits(c.caller)} · ${c.language === "en" ? "English" : "Español"} · ${c.talkSec || 0}s${c.ticket ? " · " + (c.ticket.receiptNumber ? "Receipt #" + esc(c.ticket.receiptNumber) + " " : "ticket ") + money(c.ticket.totalCents) : ""}</div>
    </div>`).join("") : `<div class="empty">No hay llamadas en este periodo.</div>`;
  document.querySelectorAll(".call").forEach((el) => el.onclick = () => { current = Number(el.dataset.i); list(); detail(); });
}

function linesTable(lines, pairs, side) {
  if (!lines?.length) return `<div class="empty">${side === "ticket" ? "Sin ticket de Square en la ventana de tiempo." : "Elvi no armó orden."}</div>`;
  return `<table><tr><th>Cant.</th><th>Artículo</th><th>Precio</th></tr>${lines.map((l) => {
    const p = pairs.find((x) => x[side] && x[side].name === l.name && x[side].totalCents === l.totalCents && JSON.stringify(x[side].choices) === JSON.stringify(l.choices));
    const cls = !pairs.length ? "" : !p || p.points === 0 ? "miss" : p.points < 100 ? "partial" : "";
    return `<tr class="${cls}"><td>${l.quantity}</td><td>${esc(l.name)}<div class="ch">${esc(l.choices.join(", "))}</div></td><td>${money(l.totalCents)}</td></tr>`;
  }).join("")}<tr><td></td><td><b>Total</b></td><td><b>${money(lines.reduce((a, l) => a + l.totalCents, 0))}</b></td></tr></table>`;
}

// ticketno1: Square's own numbers — "Receipt #XXXX" (payment receipt number, searchable in Transactions) and the POS
// "Ticket" name; links to the public receipt and the Dashboard transaction. The long order ID is kept on hover.
function sqRef(t) {
  if (t.matchedBy === "manual") return "orden a mano";
  const parts = [];
  if (t.receiptNumber) parts.push(t.receiptUrl ? `<a href="${esc(t.receiptUrl)}" target="_blank" rel="noopener" title="Order ${esc(t.id)}">Receipt #${esc(t.receiptNumber)}</a>` : `<span title="Order ${esc(t.id)}">Receipt #${esc(t.receiptNumber)}</span>`);
  if (t.ticketName) parts.push(`Ticket: ${esc(t.ticketName)}`);
  if (t.dashboardUrl) parts.push(`<a href="${esc(t.dashboardUrl)}" target="_blank" rel="noopener">Dashboard</a>`);
  return parts.length ? parts.join(" · ") : `<span title="Order ${esc(t.id)}">pedido …${esc(String(t.id || "").slice(-6))}</span>`;
}

function detail() {
  const c = data.calls[current];
  if (!c) return;
  $("#detail").innerHTML = `
    <h2>${fmtTime(c.at)} ${tagHtml(c)} ${badge(c.score)}</h2>
    <div class="note">${lastDigits(c.caller)} · ${c.language === "en" ? "English" : "Español"} · ${c.answered === false ? "no contestada (" + esc(c.dialStatus || "") + ")" : "contestada " + (c.talkSec || 0) + "s"}${c.ticket ? ` · ${sqRef(c.ticket)} (${esc(c.ticket.matchedBy)}, ${fmtTime(c.ticket.createdAt)})` : ""}</div>
    ${c.hasAudio ? playerHtml(c) : ""}
    ${c.error ? `<div class="misses">Error al procesar: ${esc(c.error)}</div>` : ""}
    <h2 style="margin-top:8px">Conversación</h2>
    <div class="note">${c.hasAudio && c.turns.length ? "Toca una línea para escucharla · Tap a line to jump there" : ""}</div>
    <div class="turns" id="turns">${c.turns.length ? c.turns.map((t, k) => `<div class="turn ${spk(t.speaker)}" data-k="${k}" data-s="${Number(t.start) || 0}" data-e="${Number(t.end) || 0}"><b>${spkLabel(t.speaker)} · ${clock(t.start)}</b>${esc(t.text)}</div>`).join("") : `<div class="empty">Sin transcripción.</div>`}</div>
    <div class="cmp" style="margin-top:14px">
      <div><h2>Orden de Elvi</h2>${linesTable(c.elvi, c.pairs, "elvi")}</div>
      <div><h2>${c.ticket?.matchedBy === "manual" ? "Orden esperada (a mano)" : "Ticket de Square"}</h2>${linesTable(c.ticket?.lines, c.pairs, "ticket")}</div>
    </div>
    ${c.source === "training" && (!c.ticket || c.ticket.matchedBy === "manual") && c.turns.length ? `
    <div class="exp" style="margin-top:14px"><h2>Orden esperada</h2>
      <div class="note">Sin ticket de Square: escribe lo que se pidió (una línea por artículo) para calificar a Elvi.</div>
      <textarea id="exp-text" placeholder="2 tacos de bistec de comal&#10;2 tacos de chorizo de comal">${esc(draft?.sid === c.callSid ? draft.text : c.expected?.text || "")}</textarea>
      <div class="row"><button id="exp-prev">Vista previa</button><button id="exp-save">Guardar y calificar</button>${c.expected ? `<button id="exp-clear">Borrar</button>` : ""}</div>
      <div id="exp-out">${draft?.sid === c.callSid ? draft.html : ""}</div>
    </div>` : ""}
    ${c.misses.length ? `<ul class="misses">${c.misses.map((m) => `<li>${esc(m.detail)}</li>`).join("")}</ul>` : c.score !== null ? `<div class="note" style="color:var(--ok);margin-top:8px">✓ Coincide con el ticket.</div>` : ""}`;
  wirePlayer();
}

// remotecalls1: same PIN as the counter phone (phone.html saves it in this browser as elviPhonePin; sent as x-phone-pin).
// On this Mac (localhost) no PIN is needed. Audio is fetched with the PIN header and played from a blob (works on iPhone Safari).
let pin = localStorage.getItem("elviPhonePin") || "";
const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...(pin ? { "x-phone-pin": pin } : {}) } });
function askPin(msg) {
  document.querySelector("main").style.display = "none";
  if (!$("#pinbox")) document.body.insertAdjacentHTML("beforeend", `<form id="pinbox" class="card"><h2>PIN del teléfono / Phone PIN</h2><input id="pin-in" type="password" inputmode="numeric" autocomplete="current-password" /><button>Entrar / Sign in</button><div id="pin-err" class="note" style="color:var(--bad)"></div></form>`);
  $("#pin-err").textContent = msg || "";
  $("#pinbox").onsubmit = (e) => { e.preventDefault(); pin = $("#pin-in").value.trim(); if (pin) localStorage.setItem("elviPhonePin", pin); load(); };
  $("#pin-in").focus();
}
let blobUrl = null;
async function loadAudio(a, sid) {
  const url = `/api/calls/${encodeURIComponent(sid)}/audio`;
  if (isLocal) { a.src = url; return; }
  $("#p-tm").textContent = "Cargando… / Loading…";
  const r = await api(url);
  if (!r.ok) { $("#p-tm").textContent = r.status === 401 ? "PIN requerido" : "Error " + r.status; return; }
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: "audio/wav" }));
  if (a.isConnected) { a.src = blobUrl; a.load(); }
}

// player1: audio player + clickable dialogue. Audio comes only from the localhost-only /api/calls/:sid/audio (WAV on this Mac).
const spk = (s) => s === "caller" ? "caller" : s === "elvi" ? "elvi" : "staff";
const spkLabel = (s) => s === "caller" ? "Cliente / Caller" : s === "elvi" ? "Elvi 💗" : "Staff";
const clock = (x) => { x = Math.max(0, Number(x) || 0); const m = Math.floor(x / 60), s = Math.floor(x % 60); return `${m}:${String(s).padStart(2, "0")}`; };
function playerHtml(c) {
  return `<div class="player" id="player">
    <audio id="aud" preload="metadata" playsinline data-sid="${esc(c.recordingSid)}"></audio>
    <div class="row1">
      <button id="p-play" title="Reproducir / Play">▶ Play</button>
      <button id="p-stop" title="Detener / Stop">■ Stop</button>
      <button id="p-back" title="-10s">⏪ 10s</button>
      <button id="p-fwd" title="+10s">10s ⏩</button>
      <span style="width:6px"></span>
      ${[1, 1.5, 2].map((r) => `<button class="p-rate ${r === 1 ? "on" : ""}" data-r="${r}" title="Velocidad / Speed">${r}x</button>`).join("")}
      <span class="tm" id="p-tm">0:00 / –:––</span>
    </div>
    <input type="range" id="p-seek" min="0" max="1000" value="0" step="1" aria-label="Posición / Seek" />
  </div>`;
}
function wirePlayer() {
  const a = $("#aud"); if (!a) return;
  loadAudio(a, a.dataset.sid);
  const seek = $("#p-seek"), tm = $("#p-tm"), play = $("#p-play");
  let dragging = false, lastK = -1;
  const dur = () => (isFinite(a.duration) && a.duration > 0 ? a.duration : 0);
  const paint = () => {
    if (!dragging && dur()) seek.value = String(Math.round((a.currentTime / dur()) * 1000));
    tm.textContent = `${clock(a.currentTime)} / ${dur() ? clock(dur()) : "–:––"}`;
    play.textContent = a.paused ? "▶ Play" : "❚❚ Pausa";
    const t = a.currentTime; let k = -1;
    document.querySelectorAll("#turns .turn").forEach((el) => { const s0 = +el.dataset.s, e0 = +el.dataset.e; if (t >= s0 && t <= Math.max(e0, s0 + 0.5)) k = +el.dataset.k; });
    if (k !== lastK) {
      document.querySelectorAll("#turns .turn.now").forEach((el) => el.classList.remove("now"));
      const el = k >= 0 && document.querySelector(`#turns .turn[data-k="${k}"]`);
      if (el) { el.classList.add("now"); if (!a.paused) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
      lastK = k;
    }
  };
  const go = (t) => { a.currentTime = Math.min(Math.max(0, t), dur() || t); paint(); };
  play.onclick = () => (a.paused ? a.play() : a.pause());
  $("#p-stop").onclick = () => { a.pause(); go(0); };
  $("#p-back").onclick = () => go(a.currentTime - 10);
  $("#p-fwd").onclick = () => go(a.currentTime + 10);
  document.querySelectorAll(".p-rate").forEach((b) => b.onclick = () => { a.playbackRate = +b.dataset.r; document.querySelectorAll(".p-rate").forEach((x) => x.classList.toggle("on", x === b)); });
  seek.oninput = () => { dragging = true; if (dur()) tm.textContent = `${clock((seek.value / 1000) * dur())} / ${clock(dur())}`; };
  seek.onchange = () => { dragging = false; if (dur()) go((seek.value / 1000) * dur()); };
  ["timeupdate", "loadedmetadata", "play", "pause", "ended", "seeked"].forEach((ev) => a.addEventListener(ev, paint));
  document.querySelectorAll("#turns .turn").forEach((el) => el.onclick = () => { go(+el.dataset.s); a.play(); });
  paint();
}

async function expected(save, clear) {
  const c = data.calls[current];
  const text = $("#exp-text")?.value || "";
  draft = { sid: c.callSid, text, html: `<div class="note">Procesando…</div>` };
  $("#exp-out").innerHTML = draft.html;
  const r = await api(`/api/calls/${encodeURIComponent(c.callSid)}/expected`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(clear ? { clear: true } : { text, save }) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { draft.html = `<div class="ask">${esc(out.error || "Error")}</div>`; $("#exp-out").innerHTML = draft.html; return; }
  if (clear || out.saved) { draft = null; await load(); return; }
  draft.html = (out.lines?.length ? linesTable(out.lines, [], "ticket") : `<div class="ask">No se entendió ningún artículo.</div>`) + (out.open ? `<div class="ask">Falta: ${esc(out.open)}</div>` : "");
  $("#exp-out").innerHTML = draft.html;
}

async function load() {
  const r = await api(`/api/calls/accuracy?days=${$("#days").value}`);
  if (r.status === 401 || r.status === 429) return askPin(r.status === 429 ? "Demasiados intentos. Espere 10 minutos." : pin ? "PIN incorrecto." : "");
  $("#pinbox")?.remove(); document.querySelector("main").style.display = "";
  data = await r.json();
  if (!r.ok) { $("#list").innerHTML = `<div class="empty">${esc(data.error || "Error")}</div>`; return; }
  const cust = avgOf(data.calls.filter((c) => c.source !== "training")), tr = avgOf(data.calls.filter((c) => c.source === "training"));
  $("#k-avg").textContent = cust.avg === null ? "–" : cust.avg + "%"; $("#k-scored").textContent = cust.n;
  $("#k-train").textContent = tr.avg === null ? "–" : tr.avg + "%"; $("#k-tscored").textContent = tr.n;
  $("#k-calls").textContent = data.calls.filter((c) => c.turns.length).length;
  $("#k-missed").textContent = data.calls.filter((c) => c.answered === false).length;
  $("#sqnote").textContent = data.squareError ? `Square: ${data.squareError}` : `Tickets de Square revisados: ${data.ordersSearched} (solo lectura). Se empareja por teléfono y hora (2 min antes a 45 min después de la llamada).`;
  if (current === null && data.calls.length) current = 0;
  chart(); list(); detail();
}
