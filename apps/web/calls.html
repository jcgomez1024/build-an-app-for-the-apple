<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call Accuracy · Cocina Elvis</title>
<link rel="icon" type="image/png" href="./img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#1d1d1f;--mut:#6b6b70;--bg:#f6f4ef;--card:#fff;--line:#e6e2d9;--ok:#1a8c3a;--okbg:#e5f6ea;--warn:#b26a00;--warnbg:#fff4dc;--bad:#c62828;--badbg:#fdeaea;--acc:#1471d6}
  *{box-sizing:border-box}body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  header img{width:42px;height:42px}header h1{font-family:Syne,sans-serif;font-size:22px;margin:0}header .sp{flex:1}
  select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  main{max-width:1200px;margin:0 auto;padding:18px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi b{display:block;font-size:28px;font-family:Syne,sans-serif}.kpi span{color:var(--mut);font-size:13px}
  h2{font-size:16px;margin:0 0 10px}
  .chart{display:flex;align-items:flex-end;gap:6px;height:150px;position:relative;border-bottom:1px solid var(--line);padding-top:8px}
  .chart .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);font-size:11px;color:var(--ok)}
  .bar{flex:1;min-width:14px;max-width:46px;border-radius:6px 6px 0 0;background:var(--acc);position:relative}
  .bar small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
  .bar i{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-style:normal}
  .tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--ink);color:#fff}
  .layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
  .list{display:grid;gap:8px;max-height:72vh;overflow:auto}
  .call{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:#fff}
  .call.on{outline:2px solid var(--acc)}.call .t{font-weight:700}.call .m{color:var(--mut);font-size:12px}
  .badge{align-self:center;grid-row:span 2;font-weight:700;border-radius:999px;padding:4px 10px;font-size:13px}
  .b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-na{background:#eee;color:var(--mut)}
  .turns{display:grid;gap:6px;max-height:300px;overflow:auto}
  .turn{padding:6px 10px;border-radius:10px;max-width:85%;font-size:14px}.turn.caller{background:#eef4ff;justify-self:start}.turn.staff{background:#f1efe9;justify-self:end}
  .turn b{font-size:11px;color:var(--mut);display:block}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut)}
  tr.miss td{background:var(--badbg)}tr.partial td{background:var(--warnbg)}.ch{color:var(--mut);font-size:12px}
  .misses{margin:10px 0 0;padding-left:18px;color:var(--bad)}.empty{color:var(--mut);padding:20px;text-align:center}
  .note{font-size:12px;color:var(--mut)}
  .navl{font-size:14px;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  #pinbox{max-width:360px;margin:60px auto;display:grid;gap:10px}#pinbox input{font:inherit;font-size:22px;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:4px}
  @media (max-width:600px){header{flex-wrap:wrap;padding:10px 12px}header h1{font-size:18px}main{padding:10px}.kpi b{font-size:22px}.list{max-height:40vh}.turn{max-width:95%}.player button{flex:1 1 auto}}
  .player{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fbfaf7}
  .player .row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.player button{min-width:44px;min-height:40px}
  .player button.on{background:var(--ink);color:#fff}.player .tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;margin-left:auto}
  .player input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--acc);height:28px}
  .turn{cursor:pointer;transition:background .15s}.turn:hover{filter:brightness(.97)}.turn.elvi{background:#fde8f1;justify-self:end}
  .turn.now{outline:2px solid var(--acc);box-shadow:0 2px 8px #1471d633}
  .turns{max-height:420px}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#efe6ff;color:#5b2bb5;margin-left:6px;vertical-align:middle}
  .filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.filters button.on{background:var(--ink);color:#fff}
  .exp textarea{width:100%;min-height:70px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px}
  .exp .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.exp .ask{color:var(--warn);font-size:13px;margin-top:6px}
  @media (max-width:820px){.layout,.cmp{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.lang-btn{margin-left:6px;padding:2px 10px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer}.lang-btn.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
/* cmp1: comparison view */
.cmp-sum{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.cmp-sum>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:13px}
.cmp-call{border-top:1px solid #e2e8f0;padding:12px 0}.cmp-h{font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.cmp-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cmp-cols h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;color:#64748b}
.cmp-it{border-radius:6px;padding:4px 6px;margin-bottom:4px;font-size:13px;line-height:1.3}.cmp-it small{display:block;color:#475569}
.c-ok{background:#dcfce7}.c-bad{background:#fee2e2}.c-ext{background:#fef3c7}.c-bad b.m,.c-ok b.m{color:#b91c1c;font-weight:600}
@media (max-width:700px){.cmp-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="./img/logo-cocina-elvis.png" alt="" /><h1>Llamadas / Calls</h1><a class="navl" href="phone.html">📞 Teléfono</a><span class="sp"></span>
  <select id="days"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option></select>
  <button id="cmp-btn" title="Orden correcta vs ticket vs Elvi">⚖️ Comparar</button>
  <button id="reload">Actualizar</button></header>
<main>
  <section class="card" id="cmp" style="display:none"><h2>Comparar: orden correcta · ticket · Elvi</h2>
    <div class="filters" id="cmp-f"><button data-g="bg" class="on">Best + Good</button><button data-g="all">Todas (incl. medium / bad)</button> <label class="note"><input type="checkbox" id="cmp-train"> incluir llamadas de entrenamiento</label></div>
    <div id="cmp-sum" class="cmp-sum"></div><div id="cmp-list"></div></section>
  <section class="kpis">
    <div class="card kpi"><b id="k-avg">–</b><span>Elvi hoy vs orden correcta (meta 95%) · <i id="k-scored">0</i> calificadas</span></div>
    <div class="card kpi"><b id="k-train">–</b><span>Precisión en entrenamiento · <i id="k-tscored">0</i> calificadas</span></div>
    <div class="card kpi"><b id="k-calls">–</b><span>Llamadas grabadas</span></div>
    <div class="card kpi"><b id="k-missed">–</b><span>No contestadas</span></div>
  </section>
  <section class="card"><div class="tabs"><button data-p="daily" class="on">Diario</button><button data-p="weekly">Semanal</button></div>
    <div class="chart" id="chart"></div><div class="note" style="margin-top:22px" id="sqnote"></div>
    <div class="note" id="namenote" title="Informativo: no cuenta en la calificación de Elvi"></div></section>
  <section class="card" id="readbacks"><h2>Read-back del personal</h2><div id="rb-summary" class="note">–</div></section>
  <section class="card" id="learning"><h2>Aprendizaje de Elvi</h2><div class="note" id="learn-body">–</div></section>
  <section class="layout">
    <div class="card"><h2>Llamadas</h2><div class="filters" id="filters"><button data-f="all" class="on">Todas</button><button data-f="customer">Clientes</button><button data-f="training">Entrenamiento</button></div><div class="list" id="list"></div></div>
    <div class="card" id="detail"><div class="empty">Elige una llamada.</div></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const money = (c) => `$${(Number(c || 0) / 100).toFixed(2)}`;
const fmtTime = (iso) => new Date(iso).toLocaleString("es-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const badge = (s) => s === null ? `<span class="badge b-na">sin ticket</span>` : `<span class="badge ${s >= 95 ? "b-ok" : s >= 80 ? "b-warn" : "b-bad"}">${s}%</span>`;
const lastDigits = (p) => (p ? "•••" + String(p).replace(/\D/g, "").slice(-4) : "");
let data = null, period = "daily", current = null, filter = "all", draft = null;
const tagHtml = (c) => c.source === "training" ? `<span class="tag">Entrenamiento</span>` : "";
const shown = () => data.calls.map((c, i) => ({ c, i })).filter(({ c }) => filter === "all" || (filter === "training" ? c.source === "training" : c.source !== "training"));
// unclear1: "Orden poco clara" — listed and used for training (difficulty messy), never in Elvi/staff accuracy
const unclearBadge = (c) => c.unclear ? ` <span class="tag" style="background:#fde68a;color:#78350f" title="${esc(c.unclear.note || "Orden poco clara: no cuenta para la precisión")}">Orden poco clara</span>` : "";
const unclearToggle = (c) => /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? `<div class="note"><label><input type="checkbox" ${c.unclear ? "checked" : ""} onchange="setUnclear('${c.callSid}', this.checked)"> Orden poco clara (no cuenta para la precisión; sí para entrenar)</label></div>` : "";
async function setUnclear(sid, on) { const note = on ? prompt("Nota (opcional):", "") : null; const r = await fetch(`/api/calls/${sid}/unclear`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ unclear: on, note }) }); if (!r.ok) alert("No se pudo: " + r.status); else location.reload(); }
// readback1: staff read-back per call + accuracy with vs without, by answering device (not by person — no staff name yet)
// grade1: data quality of the call for training (best / good / medium / bad)
const GRADE_UI = { best: ["Datos: excelente", "#bbf7d0", "#14532d"], good: ["Datos: bueno", "#dbeafe", "#1e3a8a"], medium: ["Datos: medio", "#fef3c7", "#78350f"], bad: ["Datos: malo", "#fecaca", "#7f1d1d"] };
const gradeBadge = (c) => c.grade && GRADE_UI[c.grade] ? ` <span class="tag" style="background:${GRADE_UI[c.grade][1]};color:${GRADE_UI[c.grade][2]}" title="Calidad de datos para entrenar a Elvi">${GRADE_UI[c.grade][0]}</span>` : "";
const STAFF_UI = { best: "Personal: excelente", good: "Personal: bueno", medium: "Personal: medio", bad: "Personal: malo" }; // staffgrade1
const staffBadge = (c) => c.staffGrade && STAFF_UI[c.staffGrade] ? ` <span class="tag" style="background:${GRADE_UI[c.staffGrade][1]};color:${GRADE_UI[c.staffGrade][2]}" title="Ticket vs orden correcta + read-back confirmado">${STAFF_UI[c.staffGrade]}</span>` : "";
const rbTag = (c) => c.readback && c.readback.status !== "none" ? ` <span class="tag" title="El personal repitió la orden al final">${c.readback.status === "confirmed" ? "🔁 Read-back ✓" : "🔁 Read-back corregido"}</span>` : "";
function renderReadbacks(calls) {
  const el = document.getElementById("rb-summary"); if (!el) return;
  const rows = calls.filter((c) => c.score !== null && !c.unclear && c.source !== "training");
  const groups = {}; for (const c of rows) for (const k of ["Todas", c.answeredBy || "?"]) (groups[k] = groups[k] || []).push(c);
  const a = (xs) => xs.length ? (Math.round(xs.reduce((s, c) => s + c.score, 0) / xs.length * 10) / 10) + "%" : "–";
  el.innerHTML = `<table><tr><th>Contestó</th><th>Llamadas</th><th>Con read-back</th><th>Elvi con</th><th>Elvi sin</th></tr>${Object.entries(groups).map(([k, xs]) => { const w = xs.filter((c) => c.readback && c.readback.status !== "none"); const wo = xs.filter((c) => !c.readback || c.readback.status === "none"); return `<tr><td>${esc(k)}</td><td>${xs.length}</td><td>${w.length}</td><td>${a(w)}</td><td>${a(wo)}</td></tr>`; }).join("")}</table><div class="note">Por aparato (escritorio 9249, celular 6793, mostrador). Por persona: opción futura si se captura el nombre del personal al contestar.</div>`;
}
const avgOf = (rows) => { const s = rows.filter((c) => c.score !== null && !c.unclear); /* unclear1: not in accuracy */ return { n: s.length, avg: s.length ? Math.round(s.reduce((a, c) => a + c.score, 0) / s.length * 10) / 10 : null }; };

function chart() {
  const rows = ((filter === "training" ? data?.trainingTrend : data?.trend)?.[period] || []).slice(-14);
  const el = $("#chart");
  if (!rows.length) { el.innerHTML = `<div class="empty" style="width:100%">Todavía no hay llamadas ${filter === "training" ? "de entrenamiento" : "de clientes"} calificadas.</div>`; return; }
  el.innerHTML = `<div class="goal" style="bottom:${95 * 1.4}px">95%</div>` + rows.map((r) =>
    `<div class="bar" style="height:${Math.max(4, r.avg * 1.4)}px;background:${r.avg >= 95 ? "var(--ok)" : r.avg >= 80 ? "var(--warn)" : "var(--bad)"}"><i>${r.avg}%</i><small>${esc(r.period.replace(/^wk /, "sem "))} (${r.calls})</small></div>`).join("");
}

// namecheck1: name Elvi heard vs the staff ticket — informational only.
const NAME_LBL = { match: ["✓ nombre", "var(--ok)"], close: ["≈ nombre", "var(--warn)"], missing: ["sin nombre", "var(--warn)"], mismatch: ["✗ nombre", "var(--bad)"] };
function nameTag(c) {
  const n = c.nameCheck; if (!n || (!n.heard && !n.result)) return "";
  const l = n.result ? NAME_LBL[n.result] : null;
  return ` <span class="tag" title="Nombre que escuchó Elvi${n.ticket ? " · ticket: " + esc(n.ticket) : ""} (informativo)"${l ? ` style="border-color:${l[1]}"` : ""}>🎧 ${esc(n.heard || "—")}${l ? " · " + l[0] : ""}</span>`;
}
function nameNote() {
  const el = $("#namenote"); if (!el) return;
  const w = (data?.nameTrend || []).slice(-1)[0];
  el.textContent = w ? `Nombres (${w.period.replace(/^wk /, "sem ")}): escuchó ${w.heard}/${w.calls} · comparadas ${w.compared}: ✓ ${w.match} · ≈ ${w.close} · sin nombre ${w.missing} · ✗ ${w.mismatch}${w.accuracy !== null ? ` · ${w.accuracy}%` : ""} (informativo, no cuenta en la calificación)` : "";
}

// lang2: saved language per number — staff toggle (wins over auto); auto corrections shown as notes (no pings).
function langHtml(c) {
  const sl = c.savedLanguage, cur = sl?.language || null;
  const src = !sl ? "sin guardar" : sl.from === "manual" ? `manual${sl.by ? " · " + esc(sl.by) : ""}${sl.at ? " · " + fmtTime(sl.at) : ""}` : sl.from === "key" ? "oprimió tecla" : "automático";
  const notes = (c.languageNotes || []).map((n) => `<div class="note">🌐 ${n.kind === "manual" ? `Idioma cambiado a mano${n.by ? " por " + esc(n.by) : ""}` : "Idioma corregido automáticamente"}: ${esc((n.from || "?").toUpperCase())} → ${esc(String(n.to).toUpperCase())}${n.share ? ` (${Math.round(n.share * 100)}%)` : ""} · ${fmtTime(n.at)}</div>`).join("");
  return `<div class="note">Idioma guardado para este número: <b>${cur ? cur.toUpperCase() : "—"}</b> (${src})
    <button type="button" class="lang-btn${cur === "es" ? " on" : ""}" onclick="setLang('${esc(c.callSid)}','es')">ES</button>
    <button type="button" class="lang-btn${cur === "en" ? " on" : ""}" onclick="setLang('${esc(c.callSid)}','en')">EN</button></div>${notes}`;
}
async function setLang(sid, language) {
  let by = localStorage.getItem("elviStaffName") || "";
  if (!by) { by = (prompt("¿Tu nombre? (para el registro)") || "").trim(); if (by) localStorage.setItem("elviStaffName", by); }
  const r = await api(`/api/calls/${encodeURIComponent(sid)}/language`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ language, by }) });
  if (!r.ok) { alert("No se pudo guardar el idioma."); return; }
  load();
}

function list() {
  nameNote();
  const calls = shown();
  $("#list").innerHTML = calls.length ? calls.map(({ c, i }) => `
    <div class="call ${current === i ? "on" : ""}" data-i="${i}">
      <div class="t">${fmtTime(c.at)}${tagHtml(c)}${unclearBadge(c)}${rbTag(c)}${gradeBadge(c)}${staffBadge(c)}${auditBadge(c)}${nameTag(c)}${c.orderName ? ` <span class="tag" title="Nombre de la orden">👤 ${esc(c.orderName)}</span>` : ""}</div>${c.answered === false ? `<span class="badge b-bad">no contestada</span>` : c.turns.length ? badge(c.score) : `<span class="badge b-na">${c.error ? "error" : "sin audio"}</span>`}
      <div class="m">${lastDigits(c.caller)} · ${c.language === "en" ? "English" : "Español"} · ${c.talkSec || 0}s${c.ticket ? " · " + (c.ticket.receiptNumber ? "Receipt #" + esc(c.ticket.receiptNumber) + " " : "ticket ") + money(c.ticket.totalCents) : ""}</div>
    </div>`).join("") : `<div class="empty">No hay llamadas en este periodo.</div>`;
  document.querySelectorAll(".call").forEach((el) => el.onclick = () => { current = Number(el.dataset.i); list(); detail(); });
}

function linesTable(lines, pairs, side) {
  if (!lines?.length) return `<div class="empty">${side === "ticket" ? "Sin ticket de Square en la ventana de tiempo." : "Elvi no armó orden."}</div>`;
  return `<table><tr><th>Cant.</th><th>Artículo</th><th>Precio</th></tr>${lines.map((l) => {
    const p = pairs.find((x) => x[side] && x[side].name === l.name && x[side].totalCents === l.totalCents && JSON.stringify(x[side].choices) === JSON.stringify(l.choices));
    const cls = !pairs.length ? "" : !p || p.points === 0 ? "miss" : p.points < 100 ? "partial" : "";
    return `<tr class="${cls}"><td>${l.quantity}</td><td>${esc(l.name)}<div class="ch">${esc(l.choices.join(", "))}</div></td><td>${money(l.totalCents)}</td></tr>`;
  }).join("")}<tr><td></td><td><b>Total</b></td><td><b>${money(lines.reduce((a, l) => a + l.totalCents, 0))}</b></td></tr></table>`;
}

// ticketno1: Square's own numbers — "Receipt #XXXX" (payment receipt number, searchable in Transactions) and the POS
// "Ticket" name; links to the public receipt and the Dashboard transaction. The long order ID is kept on hover.
function sqRef(t) {
  if (t.matchedBy === "manual") return "orden a mano";
  const parts = [];
  if (t.receiptNumber) parts.push(t.receiptUrl ? `<a href="${esc(t.receiptUrl)}" target="_blank" rel="noopener" title="Order ${esc(t.id)}">Receipt #${esc(t.receiptNumber)}</a>` : `<span title="Order ${esc(t.id)}">Receipt #${esc(t.receiptNumber)}</span>`);
  if (t.ticketName) parts.push(`Ticket: ${esc(t.ticketName)}`);
  if (t.dashboardUrl) parts.push(`<a href="${esc(t.dashboardUrl)}" target="_blank" rel="noopener">Dashboard</a>`);
  return parts.length ? parts.join(" · ") : `<span title="Order ${esc(t.id)}">pedido …${esc(String(t.id || "").slice(-6))}</span>`;
}

function detail() {
  const c = data.calls[current];
  if (!c) return;
  $("#detail").innerHTML = `
    <h2>${fmtTime(c.at)} ${tagHtml(c)} ${badge(c.score)}${c.compare ? replayTag(c) : ""}${unclearBadge(c)}${rbTag(c)}${gradeBadge(c)}${staffBadge(c)}${nameTag(c)}</h2>${c.readback && c.readback.status !== "none" ? `<div class="note">Read-back (${esc(c.answeredBy || "?")}): “${esc(c.readback.staffText || "")}” → “${esc(c.readback.response || "")}”</div>` : ""}${unclearToggle(c)}
    <div class="note">${lastDigits(c.caller)} · ${c.language === "en" ? "English" : "Español"} · ${c.answered === false ? "no contestada (" + esc(c.dialStatus || "") + ")" : "contestada " + (c.talkSec || 0) + "s"}${c.ticket ? ` · ${sqRef(c.ticket)} (${esc(c.ticket.matchedBy)}, ${fmtTime(c.ticket.createdAt)})` : ""}</div>
    ${langHtml(c)}
    ${c.hasAudio ? playerHtml(c) : ""}
    ${c.orderName ? `<div class="note" style="margin:6px 0">A nombre de: <b>${esc(c.orderName)}</b></div>` : ""}
    ${auditHtml(c)}
    ${c.error ? `<div class="misses">Error al procesar: ${esc(c.error)}</div>` : ""}
    <h2 style="margin-top:8px">Conversación</h2>

const spk = (s) => s === "caller" ? "caller" : s === "elvi" ? "elvi" : "staff";

function playerHtml(c) {
  return `<div class="player" id="player">

      <span style="width:6px"></span>
      ${[1, 1.5, 2].map((r) => `<button class="p-rate ${r === 1 ? "on" : ""}" data-r="${r}" title="Velocidad / Speed">${r}x</button>`).join("")}
      <span class="tm" id="p-tm">0:00 / –:––</span>

    <input type="range" id="p-seek" min="0" max="1000" value="0" step="1" aria-label="Posición / Seek" />

function wirePlayer() {
  const a = $("#aud"); if (!a) return;
  loadAudio(a, a.dataset.sid);
  const seek = $("#p-seek"), tm = $("#p-tm"), play = $("#p-play");
  let dragging = false, lastK = -1;
  const dur = () => (isFinite(a.duration) && a.duration > 0 ? a.duration : 0);
  const paint = () => {
    if (!dragging && dur()) seek.value = String(Math.round((a.currentTime / dur()) * 1000));
    tm.textContent = `${clock(a.currentTime)} / ${dur() ? clock(dur()) : "–:––"}`;
    play.textContent = a.paused ? "▶ Play" : "❚❚ Pausa";
    const t = a.currentTime; let k = -1;
    document.querySelectorAll("#turns .turn").forEach((el) => { const s0 = +el.dataset.s, e0 = +el.dataset.e; if (t >= s0 && t <= Math.max(e0, s0 + 0.5)) k = +el.dataset.k; });
    if (k !== lastK) {
      document.querySelectorAll("#turns .turn.now").forEach((el) => el.classList.remove("now"));
      const el = k >= 0 && document.querySelector(`#turns .turn[data-k="${k}"]`);
      if (el) { el.classList.add("now"); if (!a.paused) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
      lastK = k;
    }
  };
  const go = (t) => { a.currentTime = Math.min(Math.max(0, t), dur() || t); paint(); };
  play.onclick = () => (a.paused ? a.play() : a.pause());
  $("#p-stop").onclick = () => { a.pause(); go(0); };
  $("#p-back").onclick = () => go(a.currentTime - 10);
  $("#p-fwd").onclick = () => go(a.currentTime + 10);
  document.querySelectorAll(".p-rate").forEach((b) => b.onclick = () => { a.playbackRate = +b.dataset.r; document.querySelectorAll(".p-rate").forEach((x) => x.classList.toggle("on", x === b)); });
  seek.oninput = () => { dragging = true; if (dur()) tm.textContent = `${clock((seek.value / 1000) * dur())} / ${clock(dur())}`; };
  seek.onchange = () => { dragging = false; if (dur()) go((seek.value / 1000) * dur()); };
  ["timeupdate", "loadedmetadata", "play", "pause", "ended", "seeked"].forEach((ev) => a.addEventListener(ev, paint));
  document.querySelectorAll("#turns .turn").forEach((el) => el.onclick = () => { go(+el.dataset.s); a.play(); });
  paint();
}

// cmp1: "Comparar" — correct order vs staff ticket vs Elvi, item by item. Data comes from /api/calls/accuracy (same PIN).
const CALLS_PAGE_VERSION = "replay3";
let cmpOn = false, cmpGrade = "bg", cmpTrain = false;
const normC = (c) => String(c).replace(/\s*\(\+\$[\d.]+\)/, "").trim().toLowerCase();
const isSalsaDefault = (c) => /mild salsa asada/i.test(c);
function cmpMatch(truth, other) {
  const used = new Set(), res = [];
  for (const t of truth) {
    let best = -1, bs = -1;
    other.forEach((o, j) => { if (used.has(j) || o.baseName !== t.baseName) return; const tc = new Set(t.choices.map(normC)); const sc = o.choices.filter((c) => tc.has(normC(c))).length * 2 - Math.abs(o.quantity - t.quantity); if (sc > bs) { bs = sc; best = j; } });
    if (best >= 0) used.add(best);
    res.push(best >= 0 ? other[best] : null);
  }
  return { res, extras: other.filter((_, j) => !used.has(j)) };
}
const realLines = (ls) => (ls || []).filter((l) => !/delivery fee|cargo de entrega/i.test(l.name || ""));
function cmpItem(l, ref, cls) {
  const rc = ref ? new Set(ref.choices.map(normC)) : null;
  const mods = l.choices.filter((c) => !isSalsaDefault(c)).map((c) => rc && !rc.has(normC(c)) ? `<b class="m">${esc(c)}</b>` : esc(c)).join(" · ");
  const qty = ref && ref.quantity !== l.quantity ? `<b class="m">${l.quantity}×</b>` : `${l.quantity}×`;
  return `<div class="cmp-it ${cls}">${qty} ${esc(l.name || l.baseName)}${mods ? `<small>${mods}</small>` : ""}</div>`;
}
function cmpCol(title, truth, lines, isTruth) {
  if (isTruth) return `<div><h4>${title}</h4>${truth.map((t) => cmpItem(t, null, "")).join("") || `<div class="note">–</div>`}</div>`;
  const { res, extras } = cmpMatch(truth, lines);
  const same = (t, o) => o && o.quantity === t.quantity && new Set(o.choices.filter((c) => !isSalsaDefault(c)).map(normC)).size === new Set(t.choices.filter((c) => !isSalsaDefault(c)).map(normC)).size && t.choices.filter((c) => !isSalsaDefault(c)).every((c) => o.choices.some((x) => normC(x) === normC(c)));
  const rows = truth.map((t, i) => { const o = res[i]; if (!o) return `<div class="cmp-it c-bad">Falta: ${t.quantity}× ${esc(t.name || t.baseName)}</div>`; return cmpItem(o, t, same(t, o) ? "c-ok" : "c-bad"); });
  return `<div><h4>${title}</h4>${rows.join("")}${extras.map((e) => cmpItem(e, null, "c-ext").replace('cmp-it c-ext">', 'cmp-it c-ext">Extra: ')).join("")}</div>`;
}
// replay3: "Elvi hoy" is the median of fresh replays; "varía" when the runs disagree (min–median–max shown)

const pct = (n) => n == null ? "–" : Math.round(n) + "%";
const avgN = (a) => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10 : null;
function topTypes(arr) { const m = {}; for (const t of arr) m[t] = (m[t] || 0) + 1; return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${esc(k)} (${v})`).join(", ") || "ninguno"; }

  const clear = rows.filter(({ c }) => !c.unclear);
  const counts = { best: 0, good: 0, medium: 0, bad: 0 }; for (const { c } of all) if (counts[c.compare.grade] !== undefined) counts[c.compare.grade]++;
  const rb = rows.filter(({ c }) => c.compare.readback !== "none").length;

    + `<div>Best ${counts.best} · Good ${counts.good} · Medium ${counts.medium} · Bad ${counts.bad}</div><div>Read-back en estas ${rows.length} llamadas: ${rb} (${rows.length ? Math.round(rb / rows.length * 100) : 0}%)${cmpGrade === "bg" ? ` · en todas las calificadas: ${all.filter(({ c }) => c.compare.readback !== "none").length} de ${all.length}` : ""}</div>`
    + `<div>Fallas Elvi hoy: ${topTypes(rows.flatMap(({ c }) => c.compare.elviMissTypes))} · en la llamada: ${topTypes(rows.flatMap(({ c }) => c.compare.elviLiveMissTypes))}</div><div>Fallas personal: ${topTypes(rows.flatMap(({ c }) => c.compare.staffMissTypes))}</div>`;

    return `<div class="cmp-call"><div class="cmp-h"><b>${fmtTime(c.at)}</b>${k.line ? `<span class="tag">línea ${esc(k.line)}</span>` : ""}${c.answeredBy ? `<span class="tag">${esc(c.answeredBy)}</span>` : ""}${gradeBadge({ grade: k.grade })}${staffBadge({ staffGrade: k.staffGrade })}${unclearBadge(c)}

      <a href="#" data-open="${i}">▶ grabación / transcripción</a></div>
      ${linkedHTML(c)}${(c.feeOnPickup || []).length ? `<div class="note">⚠ Cargo de entrega en ticket de Pickup (${c.feeOnPickup.map((x) => "#" + esc(x)).join(", ")}): cambiar a Delivery en Square. No cuenta en la calificación.</div>` : ""}
      <div class="cmp-cols">${cmpCol("Orden correcta", k.truth, [], true)}${cmpCol("Ticket del personal", k.truth, realLines(c.ticket?.lines), false)}${cmpCol("Elvi hoy (replay)", k.truth, realLines(c.elvi), false)}</div>
      ${c.elviLive && k.elviLiveScore !== k.elviScore ? `<details class="note"><summary>Elvi en la llamada (${pct(k.elviLiveScore)})</summary><div class="cmp-cols">${cmpCol("Elvi en la llamada", k.truth, realLines(c.elviLive), false)}</div></details>` : ""}${k.corrected?.length ? `<div class="note">Fuente: ${esc(k.corrected.join("; "))}</div>` : ""}</div>`; }).join("") || `<div class="empty">Sin llamadas calificadas${cmpGrade === "bg" ? " best/good — prueba «Todas»" : ""}.</div>`;
}
/* multi1: every Square ticket counted for this call (one person's order per ticket), plus a "link ticket" action */
function linkedHTML(c) {
  const L = c.ticket?.linked || [];
  const items = L.map((t) => `<span class="tag" title="${esc(t.matchedBy || "")}">${t.primary ? "Ticket" : "+ Ticket"} ${t.receiptNumber ? "#" + esc(t.receiptNumber) : esc(String(t.orderId || "").slice(0, 6))}${t.ticketName ? " · " + esc(t.ticketName) : ""} · $${(Number(t.totalCents || 0) / 100).toFixed(2)}${/manual/.test(t.matchedBy || "") && !t.primary ? " (manual)" : /auto/.test(t.matchedBy || "") ? " (auto)" : ""}${!t.primary && /manual/.test(t.matchedBy || "") ? ` <a href="#" data-unlink="${esc(c.callSid)}" data-ref="${esc(t.receiptNumber || t.orderId)}" title="Quitar">✕</a>` : ""}</span>`).join("");
  return `<div class="note">Tickets: ${items || "—"} <a href="#" data-link="${esc(c.callSid)}">＋ vincular ticket</a>${L.length > 1 ? ` · se califica contra los ${L.length} tickets juntos` : ""}</div>`;
}
document.addEventListener("click", async (e) => {
  const a = e.target.closest("[data-link],[data-unlink]"); if (!a) return; e.preventDefault();
  const sid = a.dataset.link || a.dataset.unlink;
  const ref = a.dataset.ref || prompt("Receipt # (ej. AB12) o ID de orden de Square:", ""); if (!ref) return;
  const r = await api(`/api/calls/${encodeURIComponent(sid)}/link-ticket`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ref, remove: !!a.dataset.unlink }) });
  if (!r.ok) { alert((await r.json().catch(() => ({}))).error || "Error"); return; }
  location.reload();
});
function showCompare(on) { cmpOn = on; $("#cmp").style.display = on ? "" : "none"; document.querySelectorAll("main > section:not(#cmp)").forEach((x) => x.style.display = on ? "none" : ""); $("#cmp-btn").classList.toggle("on", on); if (on) renderCompare(); }
$("#cmp-btn").onclick = () => showCompare(!cmpOn);
$("#cmp-train").onchange = (e) => { cmpTrain = e.target.checked; renderCompare(); };
document.querySelectorAll("#cmp-f button").forEach((b) => b.onclick = () => { cmpGrade = b.dataset.g; document.querySelectorAll("#cmp-f button").forEach((x) => x.classList.toggle("on", x === b)); renderCompare(); });
document.addEventListener("click", (e) => { const o = e.target.closest?.("[data-open]"); if (!o) return; e.preventDefault(); current = Number(o.dataset.open); showCompare(false); list(); detail(); $("#detail").scrollIntoView?.({ behavior: "smooth" }); });
if (location.hash === "#comparar") cmpOn = true;
$("#reload").onclick = load; $("#days").onchange = () => { current = null; load(); };
load();
</script>
